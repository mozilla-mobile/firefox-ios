format_version: '8'
default_step_lib_source: 'https://github.com/bitrise-io/bitrise-steplib.git'
project_type: ios

include:
- path: bitrise/pull-requests.yml
- path: bitrise/shared-setup.yml
- path: bitrise/release.yml
- path: bitrise/sync-integration-tests.yml
- path: bitrise/l10n.yml
- path: bitrise/performance-tests.yml
- path: bitrise/nightly-tests.yml
- path: bitrise/weekly-tests.yml
- path: bitrise/manual.yml

app:
  envs:
  - opts:
      is_expand: false
    BITRISE_EXPORT_METHOD: development
  - opts:
      is_expand: false
    BITRISE_NIGHTLY_VERSION: '9000'
  - opts:
      is_expand: false
    BITRISE_PROJECT_PATH: './firefox-ios/Client.xcodeproj'
  - opts:
      is_expand: false
    BITRISE_SCHEME: 'Fennec'
  - opts:
      is_expand: false
    BITRISE_DESTINATION: 'platform=iOS Simulator,name=Bitrise iOS default,OS=latest'
  - opts:
      is_expand: false
    TEST_FLIGHT_EXTERNAL_GROUP_NAME: Nightly
  - opts:
      is_expand: false
    APPLE_TEAM_ID: '43AQ936H96'

trigger_map:
- push_branch: main
  pipeline: pipeline_build_and_test
- push_branch: epic-branch/*
  pipeline: pipeline_build_and_test
- push_branch: release/*
  pipeline: pipeline_build_and_test
- pull_request_target_branch: main
  pipeline: pipeline_build_and_test
- pull_request_target_branch: epic-branch/*
  pipeline: pipeline_build_and_test
- pull_request_target_branch: release/v*
  pipeline: pipeline_build_and_test

meta:
  bitrise.io:
    stack: osx-xcode-27.1.x
    machine_type_id: g2.mac.4large
