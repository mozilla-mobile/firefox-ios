format_version: '8'
default_step_lib_source: 'https://github.com/bitrise-io/bitrise-steplib.git'
project_type: ios

include:
- path: bitrise/shared-setup.yml
- path: bitrise/spm-release.yml
- path: bitrise/sync-integration-tests.yml
- path: bitrise/l10n.yml
- path: bitrise/performance-tests.yml
- path: bitrise/nightly-tests.yml

pipelines:
  pipeline_build_and_test:
    workflows:
      determine_apps_affected: {}
      firefox_configure_build:
        run_if:
          expression: '{{ enveq "BUILD_FIREFOX_IOS" "true" }}'
        depends_on:
        - determine_apps_affected
      focus_configure_build:
        run_if:
          expression: '{{ enveq "BUILD_FOCUS_IOS" "true" }}'
        depends_on:
        - determine_apps_affected
        # We don't build klar for new PR now, bu we can still
        # start klar_configure_build manually.
      klar_configure_build:
        run_if:
          expression: false
        depends_on:
        - determine_apps_affected
      run_firefox_ui_tests:
        run_if:
          expression: '{{ enveq "RUN_UI_TESTS" "Run_UI_Tests" }}'
        depends_on:
        - firefox_configure_build
        parallel: 5
      focus_ui_test:
        run_if:
          expression: '{{ enveq "RUN_UI_TESTS" "Run_UI_Tests" }}'
        depends_on:
        - focus_configure_build
        parallel: 1
  pipeline_build_and_test_focus:
    workflows:
      focus_configure_build: {}
      focus_ui_test:
        depends_on:
        - focus_configure_build
        parallel: 1
  pipeline_build_and_test_release:
    workflows:
      firefox_scheme_build_for_test: {}
      firefox_beta_scheme_build_for_test: {}
      run_firefox_scheme_ui_tests:
        depends_on:
        - firefox_scheme_build_for_test
        parallel: 5
      run_firefox_beta_scheme_ui_tests:
        depends_on:
        - firefox_beta_scheme_build_for_test
        parallel: 5
workflows:
  firefox_accessibility_test:
    before_run:
    - 1_git_clone_and_post_clone
    - 2_certificate_and_profile
    - 3_provisioning_and_npm_installation
    - skip_macro_validation
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - restore-spm-cache@3:
        is_always_run: true
    - script@1:
        title: Build for Testing
        inputs:
        - content: |
            set -euxo pipefail
            echo "-- build-for-testing --"
            mkdir DerivedData

            xcrun simctl list
            xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile
            xcodebuild "-project" "/Users/vagrant/git/firefox-ios/Client.xcodeproj" "-scheme" "Fennec" -configuration "Debug" "CODE_SIGNING_ALLOWED=NO" -sdk "iphonesimulator" "-destination" "platform=iOS Simulator,name=iPhone 17,OS=26.5" "COMPILER_INDEX_STORE_ENABLE=NO" "build-for-testing" "CODE_SIGN_IDENTITY=" "CODE_SIGNING_REQUIRED=NO" "CODE_SIGNING_ALLOWED=NO" -derivedDataPath "/Users/vagrant/git/DerivedData" -skipMacroValidation | xcpretty | tee xcodebuild_fennec.log

            ls /Users/vagrant/git/DerivedData/Build/Products
            ls /Users/vagrant/git/DerivedData
    - xcode-test-without-building@0:
        continue_on_fail: true
        timeout: 1200
        inputs:
        - destination: platform=iOS Simulator,name=iPhone 17,OS=26.5
        - xcodebuild_options: '"COMPILER_INDEX_STORE_ENABLE=NO" "CODE_SIGN_IDENTITY=" "CODE_SIGNING_REQUIRED=NO" "CODE_SIGNING_ALLOWED=NO"'
        - xctestrun: "/Users/vagrant/git/DerivedData/Build/Products/Fennec_AccessibilityTestPlan_iphonesimulator26.5-arm64.xctestrun"
        - maximum_test_repetitions: 2
    - script@1:
        title: Count failed tests
        is_always_run: true
        inputs:
        - content: |
            echo "Analyzing test results from: $BITRISE_XCRESULT_PATH"
            xcrun xcresulttool get --path "$BITRISE_XCRESULT_PATH" --format json > result.json --legacy

            echo "Search for failed tests..."
            FAILED_COUNT=$(jq -r '.metrics.testsFailedCount._value' result.json)

            echo "Total number of failures: $FAILED_COUNT"

            envman add --key ACCESSIBILITY_FAILED_TEST_COUNT --value "$FAILED_COUNT"
    - script@1:
        title: Collect All Accessibility Report Files
        is_always_run: true
        inputs:
        - content: |
            echo "🔍 Search reports inside the device sandbox..."

            mkdir -p "$BITRISE_DEPLOY_DIR"

            find ~/Library/Developer/CoreSimulator/Devices -type f -name "AccessibilityReport*.txt" -exec cp {} "$BITRISE_DEPLOY_DIR" \;
            find ~/Library/Developer/CoreSimulator/Devices -type f -name "AccessibilityReport*.csv" -exec cp {} "$BITRISE_DEPLOY_DIR" \;

            echo "Files copied to $BITRISE_DEPLOY_DIR:"
            ls -lh "$BITRISE_DEPLOY_DIR"
    - deploy-to-bitrise-io@2:
        is_always_run: true
    - slack@4:
        is_always_run: true
        inputs:
        - title: ''
        - author_name: ''
        - webhook_url: "$WEBHOOK_SLACK_TOKEN"
        - footer_icon: https://emoji.slack-edge.com/T07DB2PSS3W/testops-notify/55edcdb3371320b6.png
        - footer: Created by Mobile Test Engineering
        - pretext_on_error: "*Firefox-iOS* :firefox: *Accessibility Tests* :x:"
        - pretext: "*Firefox-iOS* :firefox: *Accessibility Tests* :white_check_mark:"
        - timestamp: 'no'
        - fields: |
            Task | ${BITRISE_BUILD_URL}
            Number of A11y Failures | ${ACCESSIBILITY_FAILED_TEST_COUNT}
            Failures Report | ${BITRISE_BUILD_URL}
            Accessibility Reports | ${BITRISE_BUILD_URL}?tab=artifacts
        - buttons: |
            App|${BITRISE_APP_URL}
            #mobile-testeng|https://mozilla.slack.com/archives/C02KDDS9QM9
            Mana|https://mana.mozilla.org/wiki/display/MTE/Mobile+Test+Engineering

  firefox_configure_build:
    before_run:
    - 0_detect_standalone_build
    - 1_git_clone_and_post_clone
    - 2_certificate_and_profile
    - 3_provisioning_and_npm_installation
    - skip_macro_validation
    - decision_to_run_UI_Tests
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - restore-spm-cache@3:
        is_always_run: true
    - activate-build-cache-for-xcode@0: {}
    - xcode-build-for-test@3:
        inputs:
        - scheme: Fennec
        - configuration: Debug
        - project_path: /Users/vagrant/git/firefox-ios/Client.xcodeproj
        - xcodebuild_options: '"ONLY_ACTIVE_ARCH=YES" "COMPILER_INDEX_STORE_ENABLE=NO" -allowProvisioningUpdates -skipMacroValidation DEVELOPMENT_TEAM=$APPLE_TEAM_ID'
        - destination: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
    - script@1:
        title: Detect number of warnings
        # TODO: Fix the number of warnings reported by Xcode 27
        # https://mozilla-hub.atlassian.net/browse/FXIOS-16729
        is_always_run: true
        inputs:
        - content: |
            set -e
            set -x

            echo "bitrise_xcode"
            COUNT_XCUI=$(./test-fixtures/generate-metrics.sh $BITRISE_XCODE_RAW_RESULT_TEXT_PATH all)

            envman add --key SHOW_WARNING_IN_SLACK --value Show_Warnings
            envman add --key SHOW_WARNING_COUNT_XCUI --value "$COUNT_XCUI"

            STR=$COUNT_XCUI
            SUB='greater'
            if [[ "$STR" == *"$SUB"* ]]; then
                echo "Failure, the number of warnings increased"
                exit 1
            fi
    - script@1:
        title: Remove cache
        is_always_run: true
        inputs:
        - content: |
            export PATH="${PATH#"$HOME/.bitrise-xcelerate/bin:"}"
            envman add --key PATH --value "$PATH"
    - script@1:
        title: Override xctestrun file to UnitTests
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail

            # Point to the Unit tests plan instead of Accessibility
            UNIT_TESTS_XCTESTRUN="$BITRISE_TEST_BUNDLE_PATH/Fennec_UnitTest_iphonesimulator27.1-arm64.xctestrun"
            SMOKE_UI_XCTESTRUN="$BITRISE_TEST_BUNDLE_PATH/Fennec_Smoketest_iphonesimulator27.1-arm64.xctestrun"

            if [ ! -f "$UNIT_TESTS_XCTESTRUN" ]; then
              echo "ERROR: .xctestrun file not found: $UNIT_TESTS_XCTESTRUN"
              exit 1
            fi

            echo "Found UnitTest .xctestrun: $UNIT_TESTS_XCTESTRUN"
            envman add --key BITRISE_XCTESTRUN_UNIT_TEST_FILE_PATH --value "$UNIT_TESTS_XCTESTRUN"
            envman add --key BITRISE_XCTESTRUN_SMOKE_TEST_FILE_PATH --value "$SMOKE_UI_XCTESTRUN"

    - xcode-test-without-building@0:
        timeout: 1200
        inputs:
        - destination: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
        - xcodebuild_options: '"ONLY_ACTIVE_ARCH=YES" "COMPILER_INDEX_STORE_ENABLE=NO" "CODE_SIGN_IDENTITY=" "CODE_SIGNING_REQUIRED=NO" "CODE_SIGNING_ALLOWED=NO" -collect-test-diagnostics never'
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Fennec_UnitTest_iphonesimulator27.1-arm64.xctestrun
        - maximum_test_repetitions: 2
        - test_repetition_mode: retry_on_failure
    - xcode-test-shard-calculation@0:
        run_if: '{{enveq "BITRISE_TEST_BUNDLE_PATH" "" | not}}'
        inputs:
        - product_path: $BITRISE_XCTESTRUN_SMOKE_TEST_FILE_PATH
        - shard_count: 5
        - destination: $BITRISE_DESTINATION
        outputs:
        - BITRISE_TEST_SHARDS_PATH: BITRISE_TEST_SHARDS_PATH_FIREFOX
        is_always_run: true
    # Only push/release/epic builds save SPM cache. PRs read from the cache
    # (via restore-spm-cache@3 above) but never write back, so they can't
    # poison the cache for subsequent builds. main keeps the cache fresh.
    - save-spm-cache@1:
        is_always_run: true
        run_if: '{{not .IsPR}}'
    - script@1:
        title: Clean before deploying
        timeout: 360
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -euo pipefail

            echo "Removing raw-xcodebuild-output.log to reduce artifact size"
            rm -f "$BITRISE_DEPLOY_DIR/raw-xcodebuild-output.log"

            echo "Removing swiftlint reports already deployed by the swiftlint workflow"
            rm -f "$BITRISE_DEPLOY_DIR/swiftlint_report.txt" || true
            rm -f "$BITRISE_DEPLOY_DIR/swiftlint_report.xml" || true

            echo "Removing unit test xcresult"
            rm -f "$BITRISE_DEPLOY_DIR"/Test-Fennec_UnitTest_*.xcresult.zip || true

            echo "Removing testbundle.zip artifact (already available as pipeline intermediate)"
            rm -f "$BITRISE_DEPLOY_DIR/testbundle.zip" || true

            echo "Removing dSYM directories from test bundle to reduce pipeline artifact size"
            find "$BITRISE_TEST_BUNDLE_PATH" -name "*.dSYM" -type d -exec rm -rf {} + 2>/dev/null || true

            echo "Removing .bcsymbolmap files from test bundle"
            find "$BITRISE_TEST_BUNDLE_PATH" -name "*.bcsymbolmap" -delete 2>/dev/null || true
    - deploy-to-bitrise-io@2:
        run_if: '{{enveq "BITRISE_TEST_BUNDLE_PATH" "" | not}}'
        inputs:
        - pipeline_intermediate_files: |-
            BITRISE_TEST_SHARDS_PATH_FIREFOX
            BITRISE_TEST_BUNDLE_PATH
            BITRISE_XCTESTRUN_SMOKE_TEST_FILE_PATH
        is_always_run: true
    - script@1:
        title: Run Danger 2
        timeout: 360
        inputs:
        - content: |
            #!/usr/bin/env bash
            # Fail if any command fails
            set -e
            # Extract .xcresult using xcrun xccov
            echo "Generating coverage.json from xcresult..."
            xcrun xccov view --report --json "$BITRISE_XCRESULT_PATH" > coverage.json
            echo "coverage.json created successfully"

            # Define a cleanup function to remove the file
            function cleanup_coverage {
              if [ -f coverage.json ]; then
                echo "Removing coverage.json"
                rm coverage.json
              fi
            }
            # Register it to run on script exit
            trap cleanup_coverage EXIT

            echo "Running Danger"
            swift run danger-swift ci
    - slack@4:
        is_always_run: true
        inputs:
        - title: ''
        - author_name: ''
        - webhook_url: "$WEBHOOK_SLACK_TOKEN"
        - footer_icon: https://emoji.slack-edge.com/T07DB2PSS3W/testops-notify/55edcdb3371320b6.png
        - footer: Created by Mobile Test Engineering
        - pretext_on_error: "*Firefox-iOS* :firefox: *Build/XCUITests* :x:"
        - pretext: "*Firefox-iOS* :firefox: *Build/XCUITests* :white_check_mark:"
        - timestamp: 'no'
        - fields: |
            Task | ${BITRISE_BUILD_URL}
            Owner | ${GIT_CLONE_COMMIT_AUTHOR_NAME}
            Commit | ${GIT_CLONE_COMMIT_MESSAGE_SUBJECT}
            Source-Workflow | ${BITRISE_TRIGGERED_WORKFLOW_TITLE}
            Branch | ${BITRISE_GIT_BRANCH}
            Warnings-in-code-test | ${SHOW_WARNING_COUNT_XCUI}
        - buttons: |
            App|${BITRISE_APP_URL}
            #mobile-testeng|https://mozilla.slack.com/archives/C02KDDS9QM9
            Mana|https://mana.mozilla.org/wiki/display/MTE/Mobile+Test+Engineering
    - slack@4:
        is_always_run: true
        run_if: '{{getenv "NEW_RC_VERSION" | eq "New_RC_Version" | and .IsBuildFailed}}'
        inputs:
        - channel: "#firefox-ios"
        - text: Build status using latest Rust-Component
        - webhook_url: $WEBHOOK_SLACK_TOKEN_2

  run_firefox_ui_tests:
    before_run:
    - 1_git_clone_and_post_clone
    - 2_certificate_and_profile
    # - skip_macro_validation # TODO check if Needed here?
    steps:
    - pull-intermediate-files@1: {}
    - xcode-test-without-building@0:
        timeout: 1200
        inputs:
        - only_testing: $BITRISE_TEST_SHARDS_PATH_FIREFOX/$BITRISE_IO_PARALLEL_INDEX
        - destination: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
        - xcodebuild_options: '"ONLY_ACTIVE_ARCH=YES" "COMPILER_INDEX_STORE_ENABLE=NO" -collect-test-diagnostics never'
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Fennec_Smoketest_iphonesimulator27.1-arm64.xctestrun
    - deploy-to-bitrise-io@2: {}
  firefox_scheme_build_for_test:
    description: Build Firefox scheme and shard XCUITests for parallel execution
    before_run:
    - skip_macro_validation
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@6: {}
    - certificate-and-profile-installer@1: {}
    - restore-spm-cache@3:
        is_always_run: true
    - script@1:
        title: Run bootstrap
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            set -x
            brew trust mozilla-mobile/fxios
            brew tap mozilla-mobile/fxios
            brew install fxios
            fxios bootstrap
    - xcode-build-for-test@3:
        inputs:
        - scheme: Firefox
        - configuration: Firefox
        - project_path: /Users/vagrant/git/firefox-ios/Client.xcodeproj
        - xcodebuild_options: '"COMPILER_INDEX_STORE_ENABLE=NO" -allowProvisioningUpdates -skipMacroValidation DEVELOPMENT_TEAM=$APPLE_TEAM_ID EXCLUDED_SOURCE_FILE_NAMES=""'
        - destination: platform=iOS Simulator,name=iPhone 17,OS=26.5
    - script@1:
        title: Find Smoketest xctestrun file
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail

            echo "Listing all .xctestrun files in $BITRISE_TEST_BUNDLE_PATH"
            ls -la "$BITRISE_TEST_BUNDLE_PATH"

            # Find the Smoketest xctestrun file (handles any architecture suffix)
            SMOKE_UI_XCTESTRUN=$(find "$BITRISE_TEST_BUNDLE_PATH" -name "Firefox_Smoketest_*.xctestrun" | head -n 1)

            if [ -z "$SMOKE_UI_XCTESTRUN" ] || [ ! -f "$SMOKE_UI_XCTESTRUN" ]; then
              echo "ERROR: Smoketest .xctestrun file not found"
              exit 1
            fi

            echo "Found Smoketest .xctestrun: $SMOKE_UI_XCTESTRUN"
            envman add --key BITRISE_XCTESTRUN_SMOKE_TEST_FILE_PATH --value "$SMOKE_UI_XCTESTRUN"
    - xcode-test-shard-calculation@0:
        run_if: '{{enveq "BITRISE_TEST_BUNDLE_PATH" "" | not}}'
        inputs:
        - product_path: $BITRISE_XCTESTRUN_SMOKE_TEST_FILE_PATH
        - shard_count: 5
        - destination: $BITRISE_DESTINATION
        outputs:
        - BITRISE_TEST_SHARDS_PATH: BITRISE_TEST_SHARDS_PATH_FIREFOX_SCHEME
        is_always_run: true
    - deploy-to-bitrise-io@2:
        run_if: '{{enveq "BITRISE_TEST_BUNDLE_PATH" "" | not}}'
        inputs:
        - pipeline_intermediate_files: |-
            BITRISE_TEST_SHARDS_PATH_FIREFOX_SCHEME
            BITRISE_TEST_BUNDLE_PATH
            BITRISE_XCTESTRUN_SMOKE_TEST_FILE_PATH
        is_always_run: true
  run_firefox_scheme_ui_tests:
    description: Run Firefox scheme XCUITests in parallel
    before_run:
    - 1_git_clone_and_post_clone
    - 2_certificate_and_profile
    # - skip_macro_validation # TODO check if needed here
    steps:
    - pull-intermediate-files@1: {}
    - xcode-test-without-building@0:
        inputs:
        - only_testing: $BITRISE_TEST_SHARDS_PATH_FIREFOX_SCHEME/$BITRISE_IO_PARALLEL_INDEX
        - destination: platform=iOS Simulator,name=iPhone 17,OS=26.5
        - xcodebuild_options: '"COMPILER_INDEX_STORE_ENABLE=NO" -collect-test-diagnostics never'
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Firefox_Smoketest_iphonesimulator26.5-arm64-x86_64.xctestrun
    - deploy-to-bitrise-io@2: {}
  firefox_scheme_smoke_tests:
    description: Run XCUITests on Firefox scheme (non-parallelized, for standalone use)
    before_run:
    - firefox_scheme_build_for_test
    steps:
    - pull-intermediate-files@1: {}
    - xcode-test-without-building@0:
        inputs:
        - destination: platform=iOS Simulator,name=iPhone 17,OS=26.5
        - xcodebuild_options: '"COMPILER_INDEX_STORE_ENABLE=NO" "CODE_SIGN_IDENTITY=" "CODE_SIGNING_REQUIRED=NO" "CODE_SIGNING_ALLOWED=NO" -collect-test-diagnostics never'
        - xctestrun: $BITRISE_XCTESTRUN_SMOKE_TEST_FILE_PATH
        - maximum_test_repetitions: 2
    - deploy-to-bitrise-io@2: {}
    - slack@4:
        run_if: ".IsBuildFailed"
        inputs:
        - channel: "#mobile-alerts-ios"
        - message: "Firefox scheme XCUITests failed on build $BITRISE_BUILD_NUMBER"
        - webhook_url: "$SLACK_WEBHOOK"
  firefox_beta_scheme_build_for_test:
    description: Build FirefoxBeta scheme and shard XCUITests for parallel execution
    before_run:
    - skip_macro_validation
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@6: {}
    - certificate-and-profile-installer@1: {}
    - restore-spm-cache@3:
        is_always_run: true
    - script@1:
        title: Run bootstrap
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e
            set -x
            brew trust mozilla-mobile/fxios
            brew tap mozilla-mobile/fxios
            brew install fxios
            fxios bootstrap
    - xcode-build-for-test@3:
        inputs:
        - scheme: FirefoxBeta
        - configuration: FirefoxBeta
        - project_path: /Users/vagrant/git/firefox-ios/Client.xcodeproj
        - xcodebuild_options: '"COMPILER_INDEX_STORE_ENABLE=NO" -allowProvisioningUpdates -skipMacroValidation DEVELOPMENT_TEAM=$APPLE_TEAM_ID EXCLUDED_SOURCE_FILE_NAMES=""'
        - destination: platform=iOS Simulator,name=iPhone 17,OS=26.5
    - script@1:
        title: Find Smoketest xctestrun file
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail

            echo "Listing all .xctestrun files in $BITRISE_TEST_BUNDLE_PATH"
            ls -la "$BITRISE_TEST_BUNDLE_PATH"

            # Find the Smoketest xctestrun file (handles any architecture suffix)
            SMOKE_UI_XCTESTRUN=$(find "$BITRISE_TEST_BUNDLE_PATH" -name "FirefoxBeta_Smoketest_*.xctestrun" | head -n 1)

            if [ -z "$SMOKE_UI_XCTESTRUN" ] || [ ! -f "$SMOKE_UI_XCTESTRUN" ]; then
              echo "ERROR: Smoketest .xctestrun file not found"
              exit 1
            fi

            echo "Found Smoketest .xctestrun: $SMOKE_UI_XCTESTRUN"
            envman add --key BITRISE_XCTESTRUN_SMOKE_TEST_FILE_PATH --value "$SMOKE_UI_XCTESTRUN"
    - xcode-test-shard-calculation@0:
        run_if: '{{enveq "BITRISE_TEST_BUNDLE_PATH" "" | not}}'
        inputs:
        - product_path: $BITRISE_XCTESTRUN_SMOKE_TEST_FILE_PATH
        - shard_count: 5
        - destination: $BITRISE_DESTINATION
        outputs:
        - BITRISE_TEST_SHARDS_PATH: BITRISE_TEST_SHARDS_PATH_FIREFOX_BETA_SCHEME
        is_always_run: true
    - deploy-to-bitrise-io@2:
        run_if: '{{enveq "BITRISE_TEST_BUNDLE_PATH" "" | not}}'
        inputs:
        - pipeline_intermediate_files: |-
            BITRISE_TEST_SHARDS_PATH_FIREFOX_BETA_SCHEME
            BITRISE_TEST_BUNDLE_PATH
            BITRISE_XCTESTRUN_SMOKE_TEST_FILE_PATH
        is_always_run: true
  run_firefox_beta_scheme_ui_tests:
    description: Run FirefoxBeta scheme XCUITests in parallel
    before_run:
    - 1_git_clone_and_post_clone
    - 2_certificate_and_profile
    # - skip_macro_validation # TODO test if needed here
    steps:
    - pull-intermediate-files@1: {}
    - xcode-test-without-building@0:
        inputs:
        - only_testing: $BITRISE_TEST_SHARDS_PATH_FIREFOX_BETA_SCHEME/$BITRISE_IO_PARALLEL_INDEX
        - destination: platform=iOS Simulator,name=iPhone 17,OS=26.5
        - xcodebuild_options: '"COMPILER_INDEX_STORE_ENABLE=NO" -collect-test-diagnostics never'
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/FirefoxBeta_Smoketest_iphonesimulator26.5-arm64-x86_64.xctestrun
    - deploy-to-bitrise-io@2: {}
  firefox_beta_scheme_smoke_tests:
    description: Run XCUITests on FirefoxBeta scheme (non-parallelized, for standalone use)
    before_run:
    - firefox_beta_scheme_build_for_test
    steps:
    - pull-intermediate-files@1: {}
    - xcode-test-without-building@0:
        inputs:
        - destination: platform=iOS Simulator,name=iPhone 17,OS=26.5
        - xcodebuild_options: '"COMPILER_INDEX_STORE_ENABLE=NO" "CODE_SIGN_IDENTITY=" "CODE_SIGNING_REQUIRED=NO" "CODE_SIGNING_ALLOWED=NO" -collect-test-diagnostics never'
        - xctestrun: $BITRISE_XCTESTRUN_SMOKE_TEST_FILE_PATH
        - maximum_test_repetitions: 2
    - deploy-to-bitrise-io@2: {}
    - slack@4:
        run_if: ".IsBuildFailed"
        inputs:
        - channel: "#mobile-alerts-ios"
        - message: "FirefoxBeta scheme XCUITests failed on build $BITRISE_BUILD_NUMBER"
        - webhook_url: "$SLACK_WEBHOOK"
  determine_apps_affected:
    steps:
    - git-clone@6: {}
    - script@1:
        title: Determine which application to base configuration
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -e

            # Determine which application to base configuration while comparing against branch destination:
            # Bitrise: https://devcenter.bitrise.io/en/references/available-environment-variables.html
            #
            # BITRISEIO_GIT_BRANCH_DEST is used only on pull requests and is set to destination/branch (i.e, release/v123 )
            # BITRISE_GIT_BRANCH is the git branch that is built by Bitrise (i.e, release/v123 )
            # BITRISE_GIT_COMMIT is the git commit hash that is built by Bitrise
            #
            # If the destination branch is a release or epic branch, we need to compare changes against that destination branch
            # If the branch built by Bitrise is a release or epic branch, we need to compare changes against that branch
            # Otherwise, we need to compare changes against origin/main

            if [[ $BITRISEIO_GIT_BRANCH_DEST = release* ]] || [[ $BITRISEIO_GIT_BRANCH_DEST = epic* ]]; then
                BASE_BRANCH="$BITRISEIO_GIT_BRANCH_DEST"
                echo $BASE_BRANCH
            elif [[ $BITRISE_GIT_BRANCH = release* ]] || [[ $BITRISE_GIT_BRANCH = epic* ]]; then
                BASE_BRANCH="$BITRISE_GIT_BRANCH"
                echo $BASE_BRANCH
            else
                BASE_BRANCH="origin/main"
                echo $BASE_BRANCH
            fi

            # Determine apps affected by the changes introduced in the commit/PR
            APPS_AFFECTED=$(git diff --name-only $BASE_BRANCH..."$BITRISE_GIT_COMMIT" | xargs -n1 dirname | sort | uniq)

            echo "These are the files changed:"
            echo $APPS_AFFECTED

            # Initialize all application flags as "false" by default
            BUILD_FIREFOX_IOS="false"
            BUILD_FOCUS_IOS="false"
            BUILD_SAMPLE_BROWSER_IOS="false"

            # Manual triggers leave empty commits.
            # Check for empty commit/PR and exit blacklist check if found to avoid erroring out.
            echo "Files changed in commit/PR: $APPS_AFFECTED"
            if [[ -z "$APPS_AFFECTED" ]]; then
                echo "No files changed in commit/PR. Skipping Blacklist check..."
                # Set environment variables
                envman add --key BUILD_FIREFOX_IOS --value "true"
                envman add --key BUILD_FOCUS_IOS --value "true"
                exit 0
            fi

            # Skip building on only markdown, LICENSE, and PR template changes
            TOTAL_CHANGED_FILES_COUNT=$(git diff --name-only $BASE_BRANCH..."$BITRISE_GIT_COMMIT" | wc -l | xargs)
            DOCS_ONLY_FILE_COUNT=$(git diff --name-only $BASE_BRANCH..."$BITRISE_GIT_COMMIT" \
                | grep -Eci '(\.md$|^LICENSE$|^PULL_REQUEST_TEMPLATE$)' | xargs)

            if [ "$TOTAL_CHANGED_FILES_COUNT" -eq "$DOCS_ONLY_FILE_COUNT" ] && [ "$DOCS_ONLY_FILE_COUNT" -ne 0 ]; then
                echo "Only Markdown, LICENSE or template files have been changed. No build will be triggered."
                exit 0
            fi

            # Check for specific applications and set flags accordingly
            # Add more specific conditions for directories as needed; otherwise see default case
            # Pattern matches (*) on directory names and reacts to subdirectory changes as well
            for app in $APPS_AFFECTED; do
                # Check for root directory changes
                if [[ "$app" == "." ]]; then
                    CHANGED_FILES=$(git diff --name-only $BASE_BRANCH..."$BITRISE_GIT_COMMIT")
                    echo "Project root changes detected: $CHANGED_FILES"
                    ROOT_SPECIFIC_FILES=$(echo "$CHANGED_FILES" | grep -E '^(bootstrap\.sh|content_blocker_update\.sh|Dangerfile\.swift|Info\.plist|iOSNimbusFeatureUtility\.sh|package\.lock|Package\.json|Package\.resolved|Package\.swift|rust_components_local\.sh|setup_build_tools\.sh|update_version\.sh|\.swiftlint\.yml)$' || true)
                    echo "Root specific files: $ROOT_SPECIFIC_FILES"
                    if [ ! -z "$ROOT_SPECIFIC_FILES" ]; then
                        BUILD_FIREFOX_IOS="true"
                    fi
                fi

                case "$app" in
                    firefox-ios*)
                        BUILD_FIREFOX_IOS="true"
                        ;;
                    focus-ios*)
                        BUILD_FOCUS_IOS="true"
                        ;;
                    SampleBrowser*)
                        BUILD_SAMPLE_BROWSER_IOS="true"
                        ;;
                    BrowserKit*|taskcluster*|test-fixtures*)
                        # Explicitly directory changes - build all applications
                        BUILD_FIREFOX_IOS="true"
                        BUILD_FOCUS_IOS="true"
                        ;;
                    ".")
                        # Root directory changes - build all applications
                        BUILD_FIREFOX_IOS="true"
                        BUILD_FOCUS_IOS="false"
                        BUILD_SAMPLE_BROWSER_IOS="true"
                        ;;
                    *)
                        # Default case - build all applications (e.g, BrowserKit)
                        BUILD_FIREFOX_IOS="true"
                        BUILD_FOCUS_IOS="true"
                        BUILD_SAMPLE_BROWSER_IOS="true"
                        ;;
                esac
            done

            # Set environment variables
            envman add --key BUILD_FIREFOX_IOS --value "$BUILD_FIREFOX_IOS"
            envman add --key BUILD_FOCUS_IOS --value "$BUILD_FOCUS_IOS"
            envman add --key BUILD_SAMPLE_BROWSER_IOS --value "$BUILD_SAMPLE_BROWSER_IOS"

            echo "BUILD_FIREFOX_IOS: $BUILD_FIREFOX_IOS"
            echo "BUILD_FOCUS_IOS: $BUILD_FOCUS_IOS"
            echo "BUILD_SAMPLE_BROWSER_IOS: $BUILD_SAMPLE_BROWSER_IOS"

    - share-pipeline-variable@1:
        inputs:
        - variables: |-
            BUILD_FIREFOX_IOS
            BUILD_FOCUS_IOS
            BUILD_SAMPLE_BROWSER_IOS
    - script@1:
        title: Echo applications set
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex

            echo "BUILD_FIREFOX_IOS: $BUILD_FIREFOX_IOS"
            echo "BUILD_FOCUS_IOS: $BUILD_FOCUS_IOS"
            echo "BUILD_SAMPLE_BROWSER_IOS: $BUILD_SAMPLE_BROWSER_IOS"

