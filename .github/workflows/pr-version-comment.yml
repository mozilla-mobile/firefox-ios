name: Comment App Version on Merged PR

on:
  push:
    branches:
      - main

jobs:
  comment-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read version.txt
        id: get_version
        # Strip newlines before writing to GITHUB_OUTPUT; an embedded newline would
        # otherwise let the file's contents inject additional step outputs.
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < version.txt)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Get PR number for this merge commit
        id: get_pr
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --search "$COMMIT_SHA" --state merged --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            echo "No merged PR found for commit $COMMIT_SHA. Likely a direct push to main. Skipping comment."
          fi
          printf 'pr_number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}

      - name: Comment on PR
        if: steps.get_pr.outputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.get_pr.outputs.pr_number }}
          body: |
            🚀 PR merged to `main`, targeting version: `${{ steps.get_version.outputs.version }}`
