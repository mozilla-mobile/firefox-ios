name: 'Firefox: Nimbus FML Lint'
permissions: read-all
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'focus-ios/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Clone code repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Lint FML
        run: |
          ./firefox-ios/bin/nimbus-fml-lint.sh
