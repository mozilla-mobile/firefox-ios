name: Validate review context

on:
  pull_request:
    paths:
      - 'review-context.toml'
      - '.github/workflows/validate-review-context.yml'
  push:
    branches: [main]
    paths:
      - 'review-context.toml'
      - '.github/workflows/validate-review-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Firefox iOS
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out Bugbug validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: mozilla/bugbug
          ref: b2c767e9684d0347ba6fe84f2c16def7d5ed9b4f
          path: .bugbug-validator
          sparse-checkout: bugbug/tools/code_review/review_context_schema.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate review context
        run: python .bugbug-validator/bugbug/tools/code_review/review_context_schema.py review-context.toml
