format_version: '8'

app:
  envs:
  - opts:
      is_expand: false
    XCODEBUILD_OPTIONS: '"ONLY_ACTIVE_ARCH=YES" "COMPILER_INDEX_STORE_ENABLE=NO" "CODE_SIGN_IDENTITY=" "CODE_SIGNING_REQUIRED=NO" "CODE_SIGNING_ALLOWED=NO" -collect-test-diagnostics never -skipMacroValidation'

pipelines:
  pipeline_firefox_nightly_fullfunctional_iphone:
    workflows:
      Firefox_Nightly_Fullfunctional_Iphone: {}
      firefox_fullfunctional_shard:
        depends_on:
        - Firefox_Nightly_Fullfunctional_Iphone
        parallel: 4
      firefox_fullfunctional_report:
        depends_on:
        - firefox_fullfunctional_shard
        should_always_run: workflow

  pipeline_firefox_fullfunctional_iphone:
    workflows:
      Firefox_Fullfunctional_Iphone: {}
      firefox_fullfunctional_shard:
        depends_on:
        - Firefox_Fullfunctional_Iphone
        parallel: 4
      firefox_fullfunctional_report:
        depends_on:
        - firefox_fullfunctional_shard
        should_always_run: workflow

  pipeline_firefox_tests_ios18:
    workflows:
      Firefox_Tests_iOS18: {}
      firefox_smoketest_run:
        depends_on:
        - Firefox_Tests_iOS18
      firefox_fullfunctional_shard:
        depends_on:
        - Firefox_Tests_iOS18
        parallel: 4
      firefox_fullfunctional_report:
        depends_on:
        - firefox_smoketest_run
        - firefox_fullfunctional_shard
        should_always_run: workflow

  pipeline_firefox_tests_ios26:
    workflows:
      Firefox_Tests_iOS26: {}
      firefox_smoketest_run:
        depends_on:
        - Firefox_Tests_iOS26
      firefox_fullfunctional_shard:
        depends_on:
        - Firefox_Tests_iOS26
        parallel: 4
      firefox_fullfunctional_report:
        depends_on:
        - firefox_smoketest_run
        - firefox_fullfunctional_shard
        should_always_run: workflow

workflows:
  Firefox_Nightly_SmokeTest_Iphone:
    envs:
    - SLACK_TITLE: Nightly Smoketest iPhone
    - DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
    - SCHEME: Fennec
    after_run:
    - _firefox_smoketest

  Firefox_SmokeTest_Iphone:
    envs:
    - SLACK_TITLE: Smoketest Firefox scheme iPhone
    - DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
    - SCHEME: Firefox
    after_run:
    - _firefox_smoketest

  Firefox_SmokeTest_Ipad:
    envs:
    - SLACK_TITLE: Smoketest Firefox scheme iPad
    - DESTINATION: platform=iOS Simulator,name=iPad (A16),OS=27.0
    - SCHEME: Firefox
    after_run:
    - _firefox_smoketest

  Firefox_SmokeTest_IphoneDuo:
    envs:
    - SLACK_TITLE: Smoketest Firefox scheme iPhone Duo
    - DESTINATION: platform=iOS Simulator,name=iPhone Duo,OS=27.1
    - SCHEME: Firefox
    after_run:
    - _firefox_smoketest

  Firefox_Nightly_Fullfunctional_Iphone:
    envs:
    - SLACK_TITLE: Nightly Full Functional Tests iPhone
    - DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
    - SCHEME: Fennec
    after_run:
    - _firefox_fullfunctional_build

  Firefox_Fullfunctional_Iphone:
    envs:
    - SLACK_TITLE: Full Functional Tests Firefox scheme iPhone
    - DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
    - SCHEME: Firefox
    after_run:
    - _firefox_fullfunctional_build

  Firefox_Tests_iOS18:
    envs:
    - SLACK_TITLE: Smoketest and Full Functional Tests Firefox scheme iPhone (iOS 18.6)
    - DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=18.6
    - SCHEME: Firefox
    after_run:
    - _firefox_fullfunctional_build

  Firefox_Tests_iOS26:
    envs:
    - SLACK_TITLE: Smoketest and Full Functional Tests Firefox scheme iPhone (iOS 26.5)
    - DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
    - SCHEME: Firefox
    after_run:
    - _firefox_fullfunctional_build

  Focus_Nightly_Tests_iOS18:
    envs:
    - SLACK_TITLE: Nightly Smoketest and Full Functional Tests (iPhone and iPad, iOS 18.6)
    - IPHONE_DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=18.6
    - IPAD_DESTINATION: platform=iOS Simulator,name=iPad (A16),OS=18.6
    after_run:
    - _focus_smoke_fullfunctional_tests

  Focus_Nightly_Tests_iOS26:
    envs:
    - SLACK_TITLE: Nightly Smoketest and Full Functional Tests (iPhone and iPad, iOS 26.5)
    - IPHONE_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
    - IPAD_DESTINATION: platform=iOS Simulator,name=iPad (A16),OS=26.5
    after_run:
    - _focus_smoke_fullfunctional_tests

  Focus_Nightly_Tests_iOS27:
    envs:
    - SLACK_TITLE: Nightly Smoketest and Full Functional Tests (iPhone, iPad and iPhone Duo, iOS 27.0)
    - IPHONE_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
    - IPAD_DESTINATION: platform=iOS Simulator,name=iPad (A16),OS=27.0
    - FOCUS_DUO_DESTINATION: platform=iOS Simulator,name=iPhone Duo,OS=27.1
    after_run:
    - _focus_smoke_fullfunctional_tests

  firefox_smoketest_run:
    description: Run the Firefox smoke tests from the build shared by the pipeline
    before_run:
    - 1_git_clone_and_post_clone
    steps:
    - pull-intermediate-files@1: {}
    - xcode-test-without-building@0:
        title: Run smoke tests
        inputs:
        - destination: $DESTINATION
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/${SCHEME}_Smoketest_iphonesimulator27.1-arm64.xctestrun
        - xcodebuild_options: $XCODEBUILD_OPTIONS
    - deploy-to-bitrise-io@2:
        is_always_run: true

  firefox_fullfunctional_shard:
    description: Run one shard of the Firefox full functional tests
    before_run:
    - 1_git_clone_and_post_clone
    steps:
    - pull-intermediate-files@1: {}
    - xcode-test-without-building@0:
        title: Run full functional tests shard
        inputs:
        - only_testing: $BITRISE_TEST_SHARDS_PATH/$BITRISE_IO_PARALLEL_INDEX
        - destination: $DESTINATION
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/${SCHEME}_FullFunctionalTestPlan_iphonesimulator27.1-arm64.xctestrun
        - xcodebuild_options: $XCODEBUILD_OPTIONS
    - script@1:
        title: Count failed tests in this shard
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            ./bitrise/scripts/fullfunctional_failures.sh count
    - deploy-to-bitrise-io@2:
        is_always_run: true
        inputs:
        - pipeline_intermediate_files: $BITRISE_DEPLOY_DIR/fullfunctional_result.txt:FULLFUNCTIONAL_RESULT_$BITRISE_IO_PARALLEL_INDEX

  firefox_fullfunctional_report:
    description: Collect the failed test counts from all shards and report them to Slack
    envs:
    - FULLFUNCTIONAL_SHARD_COUNT: 4
    before_run:
    - 1_git_clone_and_post_clone
    steps:
    - pull-intermediate-files@1: {}
    - script@1:
        title: Sum failed tests across shards
        inputs:
        - content: |-
            #!/usr/bin/env bash
            ./bitrise/scripts/fullfunctional_failures.sh sum
    - slack@4:
        is_always_run: true
        inputs:
        - title: ''
        - author_name: ''
        - webhook_url: "$WEBHOOK_SLACK_TOKEN"
        - footer_icon: https://emoji.slack-edge.com/T07DB2PSS3W/testops-notify/55edcdb3371320b6.png
        - footer: Created by Mobile Test Engineering
        - footer_icon_on_error: https://emoji.slack-edge.com/T07DB2PSS3W/testops-notify/55edcdb3371320b6.png
        - footer_on_error: Created by Mobile Test Engineering
        - pretext_on_error: "*Firefox-iOS* :firefox: *${SLACK_TITLE}* :x:"
        - message_on_error: ''
        - color_on_error: danger
        - pretext: "*Firefox-iOS* :firefox: *${SLACK_TITLE}* :white_check_mark:"
        - message: ''
        - timestamp: 'no'
        - fields: |
            Branch | ${BITRISE_GIT_BRANCH}
            Scheme | ${SCHEME}
            Failed Tests | ${FAILED_TEST_COUNT}
        - buttons: |
            Build Log|https://app.bitrise.io/app/${BITRISE_APP_SLUG}/pipelines/${BITRISEIO_PIPELINE_ID}
            Test Report|https://app.bitrise.io/app/${BITRISE_APP_SLUG}/pipelines/${BITRISEIO_PIPELINE_ID}?tab=tests

  _firefox_smoketest:
    description: >-
      Shared steps for the Firefox smoke test workflows. Callers set SCHEME, DESTINATION
      and SLACK_TITLE.
    before_run:
    - 1_git_clone_and_post_clone
    - 2_certificate_and_profile
    - 3_provisioning_and_npm_installation
    - skip_macro_validation
    steps:
    - restore-spm-cache@3:
        is_always_run: true
    - activate-build-cache-for-xcode@0: {}
    - xcode-build-for-test@3:
        title: "Build Firefox iOS"
        timeout: 360
        inputs:
        - scheme: $SCHEME
        - configuration: Debug
        - project_path: /Users/vagrant/git/firefox-ios/Client.xcodeproj
        - test_plan: Smoketest
        - xcodebuild_options: $XCODEBUILD_OPTIONS
        - destination: $DESTINATION
    - xcode-test-without-building@0:
        title: "Run all smoke tests"
        timeout: 3000
        inputs:
        - destination: $DESTINATION
        - xcodebuild_options: $XCODEBUILD_OPTIONS
    - script@1:
        title: Count failed tests
        is_always_run: true
        inputs:
        - content: |
            echo "Analyzing test results from: $BITRISE_XCRESULT_PATH"
            xcrun xcresulttool get --path "$BITRISE_XCRESULT_PATH" --format json > result.json --legacy

            FAILED_COUNT=$(jq -r '.metrics.testsFailedCount._value // 0' result.json)
            echo "Total number of failures: $FAILED_COUNT"

            envman add --key FAILED_TEST_COUNT --value "$FAILED_COUNT"
    - deploy-to-bitrise-io@2:
        is_always_run: true
    - slack@4:
        is_always_run: true
        inputs:
        - title: ''
        - author_name: ''
        - webhook_url: "$WEBHOOK_SLACK_TOKEN"
        - footer_icon: https://emoji.slack-edge.com/T07DB2PSS3W/testops-notify/55edcdb3371320b6.png
        - footer: Created by Mobile Test Engineering
        - footer_icon_on_error: https://emoji.slack-edge.com/T07DB2PSS3W/testops-notify/55edcdb3371320b6.png
        - footer_on_error: Created by Mobile Test Engineering
        - pretext_on_error: "*Firefox-iOS* :firefox: *${SLACK_TITLE}* :x:"
        - message_on_error: ''
        - color_on_error: danger
        - pretext: "*Firefox-iOS* :firefox: *${SLACK_TITLE}* :white_check_mark:"
        - message: ''
        - timestamp: 'no'
        - fields: |
            Branch | ${BITRISE_GIT_BRANCH}
            Scheme | ${SCHEME}
            Failed Tests | ${FAILED_TEST_COUNT}
        - buttons: |
            Build Log|${BITRISE_BUILD_URL}
            Test Report|${BITRISE_BUILD_URL}?tab=tests

  _focus_smoke_fullfunctional_tests:
    description: >-
      Compile Focus once and run both smoke tests and full functional tests on an iPhone, iPad and iPhone Duo (when applicable).
    before_run:
    - focus-clone-and-build-dependencies
    - focus-set-default-browser-entitlement
    steps:
    - xcode-build-for-test@3:
        title: "Build Focus iOS"
        inputs:
        - scheme: Focus
        - configuration: FocusDebug
        - project_path: focus-ios/Blockzilla.xcodeproj
        - xcodebuild_options: $XCODEBUILD_OPTIONS
        - destination: $IPHONE_DESTINATION
    - xcode-test-without-building@0:
        title: "Focus Smoketest - iPhone"
        is_always_run: true
        run_if: '{{enveq "BITRISE_TEST_BUNDLE_PATH" "" | not}}'
        inputs:
        - destination: $IPHONE_DESTINATION
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Focus_SmokeTest_iphonesimulator27.1-arm64.xctestrun
        - xcodebuild_options: $XCODEBUILD_OPTIONS
    - xcode-test-without-building@0:
        title: "Focus Full Functional Tests - iPhone"
        is_always_run: true
        run_if: '{{enveq "BITRISE_TEST_BUNDLE_PATH" "" | not}}'
        inputs:
        - destination: $IPHONE_DESTINATION
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Focus_FullFunctionalTests_iphonesimulator27.1-arm64.xctestrun
        - xcodebuild_options: $XCODEBUILD_OPTIONS
    - xcode-test-without-building@0:
        title: "Focus Smoketest - iPad"
        is_always_run: true
        run_if: '{{enveq "BITRISE_TEST_BUNDLE_PATH" "" | not}}'
        inputs:
        - destination: $IPAD_DESTINATION
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Focus_SmokeTest_iphonesimulator27.1-arm64.xctestrun
        - xcodebuild_options: $XCODEBUILD_OPTIONS
    - xcode-test-without-building@0:
        title: "Focus Full Functional Tests - iPad"
        is_always_run: true
        run_if: '{{enveq "BITRISE_TEST_BUNDLE_PATH" "" | not}}'
        inputs:
        - destination: $IPAD_DESTINATION
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Focus_FullFunctionalTests_iphonesimulator27.1-arm64.xctestrun
        - xcodebuild_options: $XCODEBUILD_OPTIONS
    - xcode-test-without-building@0:
        title: "Focus Smoketest - iPhone Duo"
        is_always_run: true
        run_if: '{{and (getenv "FOCUS_DUO_DESTINATION" | ne "") (enveq "BITRISE_TEST_BUNDLE_PATH" "" | not)}}'
        inputs:
        - destination: $FOCUS_DUO_DESTINATION
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Focus_SmokeTest_iphonesimulator27.1-arm64.xctestrun
        - xcodebuild_options: $XCODEBUILD_OPTIONS
    - xcode-test-without-building@0:
        title: "Focus Full Functional Tests - iPhone Duo"
        is_always_run: true
        run_if: '{{and (getenv "FOCUS_DUO_DESTINATION" | ne "") (enveq "BITRISE_TEST_BUNDLE_PATH" "" | not)}}'
        inputs:
        - destination: $FOCUS_DUO_DESTINATION
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Focus_FullFunctionalTests_iphonesimulator27.1-arm64.xctestrun
        - xcodebuild_options: $XCODEBUILD_OPTIONS
    - deploy-to-bitrise-io@2:
        is_always_run: true
    - slack@4:
        is_always_run: true
        inputs:
        - title: ''
        - author_name: ''
        - webhook_url: "$WEBHOOK_SLACK_TOKEN"
        - footer_icon: https://emoji.slack-edge.com/T07DB2PSS3W/testops-notify/55edcdb3371320b6.png
        - footer: Created by Mobile Test Engineering
        - footer_icon_on_error: https://emoji.slack-edge.com/T07DB2PSS3W/testops-notify/55edcdb3371320b6.png
        - footer_on_error: Created by Mobile Test Engineering
        - pretext_on_error: "*Focus-iOS* *${SLACK_TITLE}* :x:"
        - message_on_error: ''
        - color_on_error: danger
        - pretext: "*Focus-iOS* *${SLACK_TITLE}* :white_check_mark:"
        - message: ''
        - timestamp: 'no'
        - fields: |
            Branch | ${BITRISE_GIT_BRANCH}
        - buttons: |
            Build Log|${BITRISE_BUILD_URL}
            Test Report|${BITRISE_BUILD_URL}?tab=tests

  _firefox_fullfunctional_build:
    description: Build Firefox iOS using the scheme and split the full functional tests into 4 shards.
    before_run:
    - 1_git_clone_and_post_clone
    - 2_certificate_and_profile
    - 3_provisioning_and_npm_installation
    - skip_macro_validation
    steps:
    - restore-spm-cache@3:
        is_always_run: true
    - activate-build-cache-for-xcode@0: {}
    - xcode-build-for-test@3:
        title: Build Firefox iOS
        inputs:
        - scheme: $SCHEME
        - configuration: Debug
        - project_path: /Users/vagrant/git/firefox-ios/Client.xcodeproj
        - xcodebuild_options: $XCODEBUILD_OPTIONS
        - destination: $DESTINATION
    - xcode-test-shard-calculation@0:
        inputs:
        - product_path: $BITRISE_TEST_BUNDLE_PATH/${SCHEME}_FullFunctionalTestPlan_iphonesimulator27.1-arm64.xctestrun
        - shard_count: 4
        - destination: $DESTINATION
    - deploy-to-bitrise-io@2:
        inputs:
        - pipeline_intermediate_files: |-
            BITRISE_TEST_SHARDS_PATH
            BITRISE_TEST_BUNDLE_PATH
    - share-pipeline-variable@1:
        inputs:
        - variables: |-
            SCHEME
            DESTINATION
            SLACK_TITLE
