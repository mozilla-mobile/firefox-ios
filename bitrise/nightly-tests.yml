format_version: '8'

pipelines:
  pipeline_firefox_nightly_fullfunctional_iphone:
    workflows:
      Firefox_Nightly_Fullfunctional_Iphone: {}
      firefox_fullfunctional_shard:
        depends_on:
        - Firefox_Nightly_Fullfunctional_Iphone
        parallel: 4
      firefox_fullfunctional_report:
        depends_on:
        - firefox_fullfunctional_shard
        should_always_run: workflow

  pipeline_firefox_fullfunctional_iphone:
    workflows:
      Firefox_Fullfunctional_Iphone: {}
      firefox_fullfunctional_shard:
        depends_on:
        - Firefox_Fullfunctional_Iphone
        parallel: 4
      firefox_fullfunctional_report:
        depends_on:
        - firefox_fullfunctional_shard
        should_always_run: workflow

workflows:
  Firefox_Nightly_SmokeTest_Iphone:
    envs:
    - SMOKETEST_SCHEME: Fennec
    - SMOKETEST_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
    - SMOKETEST_SLACK_TITLE: Nightly Smoketest iPhone
    after_run:
    - _firefox_smoketest

  Firefox_SmokeTest_Iphone:
    envs:
    - SMOKETEST_SCHEME: Firefox
    - SMOKETEST_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
    - SMOKETEST_SLACK_TITLE: Smoketest Firefox scheme iPhone
    after_run:
    - _firefox_smoketest

  Firefox_SmokeTest_Ipad:
    envs:
    - SMOKETEST_SCHEME: Firefox
    - SMOKETEST_DESTINATION: platform=iOS Simulator,name=iPad (A16),OS=27.0
    - SMOKETEST_SLACK_TITLE: Smoketest Firefox scheme iPad
    after_run:
    - _firefox_smoketest

  Firefox_SmokeTest_IphoneDuo:
    envs:
    - SMOKETEST_SCHEME: Firefox
    - SMOKETEST_DESTINATION: platform=iOS Simulator,name=iPhone Duo,OS=27.1
    - SMOKETEST_SLACK_TITLE: Smoketest Firefox scheme iPhone Duo
    after_run:
    - _firefox_smoketest

  _firefox_smoketest:
    description: >-
      Shared steps for the Firefox smoke test workflows. Callers set SMOKETEST_SCHEME, SMOKETEST_DESTINATION
      and SMOKETEST_SLACK_TITLE.
    before_run:
    - 1_git_clone_and_post_clone
    - 2_certificate_and_profile
    - 3_provisioning_and_npm_installation
    - skip_macro_validation
    steps:
    - restore-spm-cache@3:
        is_always_run: true
    - activate-build-cache-for-xcode@0: {}
    - xcode-build-for-test@3:
        title: "Build Firefox iOS"
        timeout: 360
        inputs:
        - scheme: $SMOKETEST_SCHEME
        - configuration: Debug
        - project_path: /Users/vagrant/git/firefox-ios/Client.xcodeproj
        - test_plan: Smoketest
        - xcodebuild_options: ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO
        - destination: $SMOKETEST_DESTINATION
    - xcode-test-without-building@0:
        title: "Run all smoke tests"
        timeout: 3000
        inputs:
        - destination: $SMOKETEST_DESTINATION
        - xcodebuild_options: -collect-test-diagnostics never
    - script@1:
        title: Count failed tests
        is_always_run: true
        inputs:
        - content: |
            echo "Analyzing test results from: $BITRISE_XCRESULT_PATH"
            xcrun xcresulttool get --path "$BITRISE_XCRESULT_PATH" --format json > result.json --legacy

            FAILED_COUNT=$(jq -r '.metrics.testsFailedCount._value // 0' result.json)
            echo "Total number of failures: $FAILED_COUNT"

            envman add --key SMOKETEST_FAILED_TEST_COUNT --value "$FAILED_COUNT"
    - deploy-to-bitrise-io@2:
        is_always_run: true
    - slack@4:
        is_always_run: true
        inputs:
        - title: ''
        - author_name: ''
        - webhook_url: "$WEBHOOK_SLACK_TOKEN"
        - footer_icon: https://emoji.slack-edge.com/T07DB2PSS3W/testops-notify/55edcdb3371320b6.png
        - footer: Created by Mobile Test Engineering
        - footer_icon_on_error: https://emoji.slack-edge.com/T07DB2PSS3W/testops-notify/55edcdb3371320b6.png
        - footer_on_error: Created by Mobile Test Engineering
        - pretext_on_error: "*Firefox-iOS* :firefox: *${SMOKETEST_SLACK_TITLE}* :x:"
        - message_on_error: "Number of failed tests: ${SMOKETEST_FAILED_TEST_COUNT}"
        - color_on_error: danger
        - pretext: "*Firefox-iOS* :firefox: *${SMOKETEST_SLACK_TITLE}* :white_check_mark:"
        - message: ''
        - timestamp: 'no'
        - fields: |
            Branch | ${BITRISE_GIT_BRANCH}
        - buttons: |
            Build Log|${BITRISE_BUILD_URL}
            Test Report|${BITRISE_BUILD_URL}?tab=tests

  Focus_Nightly_Tests_iOS18:
    envs:
    - FOCUS_IOS_VERSION: "18.6"
    - FOCUS_IPHONE_DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=18.6
    - FOCUS_IPAD_DESTINATION: platform=iOS Simulator,name=iPad (A16),OS=18.6
    after_run:
    - _focus_uitests

  Focus_Nightly_Tests_iOS26:
    envs:
    - FOCUS_IOS_VERSION: "26.5"
    - FOCUS_IPHONE_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
    - FOCUS_IPAD_DESTINATION: platform=iOS Simulator,name=iPad (A16),OS=26.5
    after_run:
    - _focus_uitests

  Focus_Nightly_Tests_iOS27:
    envs:
    - FOCUS_IOS_VERSION: "27.0"
    - FOCUS_IPHONE_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
    - FOCUS_IPAD_DESTINATION: platform=iOS Simulator,name=iPad (A16),OS=27.0
    - FOCUS_DUO_DESTINATION: platform=iOS Simulator,name=iPhone Duo,OS=27.1
    after_run:
    - _focus_uitests

  _focus_uitests:
    description: >-
      Compile Focus once and run both smoke tests and full functional tests on an iPhone and an iPad, plus iPhone Duo when FOCUS_DUO_DESTINATION is set.
    before_run:
    - focus-clone-and-build-dependencies
    - focus-set-default-browser-entitlement
    steps:
    - xcode-build-for-test@3:
        title: "Build Focus iOS"
        inputs:
        - scheme: Focus
        - configuration: FocusDebug
        - project_path: focus-ios/Blockzilla.xcodeproj
        - xcodebuild_options: '"ONLY_ACTIVE_ARCH=YES" "COMPILER_INDEX_STORE_ENABLE=NO" "CODE_SIGN_IDENTITY=" "CODE_SIGNING_REQUIRED=NO" "CODE_SIGNING_ALLOWED=NO" -skipMacroValidation'
        - destination: $FOCUS_IPHONE_DESTINATION
    - xcode-test-without-building@0:
        title: "Focus Smoketest - iPhone"
        is_always_run: true
        run_if: '{{enveq "BITRISE_TEST_BUNDLE_PATH" "" | not}}'
        inputs:
        - destination: $FOCUS_IPHONE_DESTINATION
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Focus_SmokeTest_iphonesimulator27.1-arm64.xctestrun
        - xcodebuild_options: '"ONLY_ACTIVE_ARCH=YES" "COMPILER_INDEX_STORE_ENABLE=NO" "CODE_SIGN_IDENTITY=" "CODE_SIGNING_REQUIRED=NO" "CODE_SIGNING_ALLOWED=NO" -collect-test-diagnostics never'
    - script@1:
        title: "Count failed tests - Smoketest - iPhone"
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            if [ -z "$BITRISE_TEST_BUNDLE_PATH" ]; then
                FAILED_COUNT="build failed"
            else
                FAILED_COUNT=$(xcrun xcresulttool get --path "$BITRISE_XCRESULT_PATH" --format json --legacy 2>/dev/null | jq -r '.metrics.testsFailedCount._value // 0')
            fi
            echo "Smoketest (iPhone) failures: ${FAILED_COUNT:-n/a}"
            envman add --key FOCUS_FAILED_SMOKETEST_IPHONE --value "${FAILED_COUNT:-n/a}"
    - xcode-test-without-building@0:
        title: "Focus Full Functional Tests - iPhone"
        is_always_run: true
        run_if: '{{enveq "BITRISE_TEST_BUNDLE_PATH" "" | not}}'
        inputs:
        - destination: $FOCUS_IPHONE_DESTINATION
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Focus_FullFunctionalTests_iphonesimulator27.1-arm64.xctestrun
        - xcodebuild_options: '"ONLY_ACTIVE_ARCH=YES" "COMPILER_INDEX_STORE_ENABLE=NO" "CODE_SIGN_IDENTITY=" "CODE_SIGNING_REQUIRED=NO" "CODE_SIGNING_ALLOWED=NO" -collect-test-diagnostics never'
    - script@1:
        title: "Count failed tests - Full Functional Tests - iPhone"
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            if [ -z "$BITRISE_TEST_BUNDLE_PATH" ]; then
                FAILED_COUNT="build failed"
            else
                FAILED_COUNT=$(xcrun xcresulttool get --path "$BITRISE_XCRESULT_PATH" --format json --legacy 2>/dev/null | jq -r '.metrics.testsFailedCount._value // 0')
            fi
            echo "Full Functional Tests (iPhone) failures: ${FAILED_COUNT:-n/a}"
            envman add --key FOCUS_FAILED_FULL_FUNCTIONAL_IPHONE --value "${FAILED_COUNT:-n/a}"
    - xcode-test-without-building@0:
        title: "Focus Smoketest - iPad"
        is_always_run: true
        run_if: '{{enveq "BITRISE_TEST_BUNDLE_PATH" "" | not}}'
        inputs:
        - destination: $FOCUS_IPAD_DESTINATION
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Focus_SmokeTest_iphonesimulator27.1-arm64.xctestrun
        - xcodebuild_options: '"ONLY_ACTIVE_ARCH=YES" "COMPILER_INDEX_STORE_ENABLE=NO" "CODE_SIGN_IDENTITY=" "CODE_SIGNING_REQUIRED=NO" "CODE_SIGNING_ALLOWED=NO" -collect-test-diagnostics never'
    - script@1:
        title: "Count failed tests - Smoketest - iPad"
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            if [ -z "$BITRISE_TEST_BUNDLE_PATH" ]; then
                FAILED_COUNT="build failed"
            else
                FAILED_COUNT=$(xcrun xcresulttool get --path "$BITRISE_XCRESULT_PATH" --format json --legacy 2>/dev/null | jq -r '.metrics.testsFailedCount._value // 0')
            fi
            echo "Smoketest (iPad) failures: ${FAILED_COUNT:-n/a}"
            envman add --key FOCUS_FAILED_SMOKETEST_IPAD --value "${FAILED_COUNT:-n/a}"
    - xcode-test-without-building@0:
        title: "Focus Full Functional Tests - iPad"
        is_always_run: true
        run_if: '{{enveq "BITRISE_TEST_BUNDLE_PATH" "" | not}}'
        inputs:
        - destination: $FOCUS_IPAD_DESTINATION
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Focus_FullFunctionalTests_iphonesimulator27.1-arm64.xctestrun
        - xcodebuild_options: '"ONLY_ACTIVE_ARCH=YES" "COMPILER_INDEX_STORE_ENABLE=NO" "CODE_SIGN_IDENTITY=" "CODE_SIGNING_REQUIRED=NO" "CODE_SIGNING_ALLOWED=NO" -collect-test-diagnostics never'
    - script@1:
        title: "Count failed tests - Full Functional Tests - iPad"
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            if [ -z "$BITRISE_TEST_BUNDLE_PATH" ]; then
                FAILED_COUNT="build failed"
            else
                FAILED_COUNT=$(xcrun xcresulttool get --path "$BITRISE_XCRESULT_PATH" --format json --legacy 2>/dev/null | jq -r '.metrics.testsFailedCount._value // 0')
            fi
            echo "Full Functional Tests (iPad) failures: ${FAILED_COUNT:-n/a}"
            envman add --key FOCUS_FAILED_FULL_FUNCTIONAL_IPAD --value "${FAILED_COUNT:-n/a}"
    - xcode-test-without-building@0:
        title: "Focus Smoketest - iPhone Duo"
        is_always_run: true
        run_if: '{{and (getenv "FOCUS_DUO_DESTINATION" | ne "") (enveq "BITRISE_TEST_BUNDLE_PATH" "" | not)}}'
        inputs:
        - destination: $FOCUS_DUO_DESTINATION
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Focus_SmokeTest_iphonesimulator27.1-arm64.xctestrun
        - xcodebuild_options: '"ONLY_ACTIVE_ARCH=YES" "COMPILER_INDEX_STORE_ENABLE=NO" "CODE_SIGN_IDENTITY=" "CODE_SIGNING_REQUIRED=NO" "CODE_SIGNING_ALLOWED=NO" -collect-test-diagnostics never'
    - script@1:
        title: "Count failed tests - Smoketest - iPhone Duo"
        is_always_run: true
        run_if: '{{getenv "FOCUS_DUO_DESTINATION" | ne ""}}'
        inputs:
        - content: |-
            #!/usr/bin/env bash
            if [ -z "$BITRISE_TEST_BUNDLE_PATH" ]; then
                FAILED_COUNT="build failed"
            else
                FAILED_COUNT=$(xcrun xcresulttool get --path "$BITRISE_XCRESULT_PATH" --format json --legacy 2>/dev/null | jq -r '.metrics.testsFailedCount._value // 0')
            fi
            echo "Smoketest (iPhone Duo) failures: ${FAILED_COUNT:-n/a}"
            envman add --key FOCUS_FAILED_SMOKETEST_DUO --value "${FAILED_COUNT:-n/a}"
    - xcode-test-without-building@0:
        title: "Focus Full Functional Tests - iPhone Duo"
        is_always_run: true
        run_if: '{{and (getenv "FOCUS_DUO_DESTINATION" | ne "") (enveq "BITRISE_TEST_BUNDLE_PATH" "" | not)}}'
        inputs:
        - destination: $FOCUS_DUO_DESTINATION
        - xctestrun: $BITRISE_TEST_BUNDLE_PATH/Focus_FullFunctionalTests_iphonesimulator27.1-arm64.xctestrun
        - xcodebuild_options: '"ONLY_ACTIVE_ARCH=YES" "COMPILER_INDEX_STORE_ENABLE=NO" "CODE_SIGN_IDENTITY=" "CODE_SIGNING_REQUIRED=NO" "CODE_SIGNING_ALLOWED=NO" -collect-test-diagnostics never'
    - script@1:
        title: "Count failed tests - Full Functional Tests - iPhone Duo"
        is_always_run: true
        run_if: '{{getenv "FOCUS_DUO_DESTINATION" | ne ""}}'
        inputs:
        - content: |-
            #!/usr/bin/env bash
            if [ -z "$BITRISE_TEST_BUNDLE_PATH" ]; then
                FAILED_COUNT="build failed"
            else
                FAILED_COUNT=$(xcrun xcresulttool get --path "$BITRISE_XCRESULT_PATH" --format json --legacy 2>/dev/null | jq -r '.metrics.testsFailedCount._value // 0')
            fi
            echo "Full Functional Tests (iPhone Duo) failures: ${FAILED_COUNT:-n/a}"
            envman add --key FOCUS_FAILED_FULL_FUNCTIONAL_DUO --value "${FAILED_COUNT:-n/a}"
            envman add --key FOCUS_DUO_SLACK_LINE --value "Failed tests on iPhone Duo - Smoketest: ${FOCUS_FAILED_SMOKETEST_DUO:-n/a}, Full Functional Tests: ${FAILED_COUNT:-n/a}"
    - deploy-to-bitrise-io@2:
        is_always_run: true
    - slack@4:
        is_always_run: true
        inputs:
        - title: ''
        - author_name: ''
        - webhook_url: "$WEBHOOK_SLACK_TOKEN"
        - footer_icon: https://emoji.slack-edge.com/T07DB2PSS3W/testops-notify/55edcdb3371320b6.png
        - footer: Created by Mobile Test Engineering
        - footer_icon_on_error: https://emoji.slack-edge.com/T07DB2PSS3W/testops-notify/55edcdb3371320b6.png
        - footer_on_error: Created by Mobile Test Engineering
        - pretext_on_error: "*Focus-iOS* *Nightly Smoketest and Full Functional Tests (iPhone and iPad, iOS ${FOCUS_IOS_VERSION})* :x:"
        - message_on_error: |-
            Failed tests on iPhone - Smoketest: ${FOCUS_FAILED_SMOKETEST_IPHONE}, Full Functional Tests: ${FOCUS_FAILED_FULL_FUNCTIONAL_IPHONE}
            Failed tests on iPad - Smoketest: ${FOCUS_FAILED_SMOKETEST_IPAD}, Full Functional Tests: ${FOCUS_FAILED_FULL_FUNCTIONAL_IPAD}
            ${FOCUS_DUO_SLACK_LINE}
        - color_on_error: danger
        - pretext: "*Focus-iOS* *Nightly Smoketest and Full Functional Tests (iPhone and iPad, iOS ${FOCUS_IOS_VERSION})* :white_check_mark:"
        - message: ''
        - timestamp: 'no'
        - fields: |
            Branch | ${BITRISE_GIT_BRANCH}
        - buttons: |
            Build Log|${BITRISE_BUILD_URL}
            Test Report|${BITRISE_BUILD_URL}?tab=tests

  Firefox_Nightly_Fullfunctional_Iphone:
    envs:
    - FULLFUNCTIONAL_SCHEME: Fennec
    - FULLFUNCTIONAL_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
    after_run:
    - _firefox_fullfunctional_build

  Firefox_Fullfunctional_Iphone:
    envs:
    - FULLFUNCTIONAL_SCHEME: Firefox
    - FULLFUNCTIONAL_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0
    after_run:
    - _firefox_fullfunctional_build

  _firefox_fullfunctional_params:
    description: >-
      Resolve the full functional test parameters. The entry workflows set FULLFUNCTIONAL_SCHEME and
      FULLFUNCTIONAL_DESTINATION, and _firefox_fullfunctional_build shares them with the shard and report workflows.
      Falls back to Fennec on iPhone 18 Pro (iOS 27.0) when they are not set.
    steps:
    - script@1:
        title: Resolve full functional test parameters
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            SCHEME="${FULLFUNCTIONAL_SCHEME:-Fennec}"
            DESTINATION="${FULLFUNCTIONAL_DESTINATION:-platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0}"
            DEVICE=$(sed -nE 's/.*name=([^,]+).*/\1/p' <<< "$DESTINATION")
            OS=$(sed -nE 's/.*OS=([^,]+).*/\1/p' <<< "$DESTINATION")
            DEVICE_LABEL="${DEVICE:-unknown device}${OS:+ (iOS $OS)}"
            echo "Scheme: $SCHEME"
            echo "Destination: $DESTINATION"
            envman add --key FULLFUNCTIONAL_SCHEME --value "$SCHEME"
            envman add --key FULLFUNCTIONAL_DESTINATION --value "$DESTINATION"
            envman add --key FULLFUNCTIONAL_DEVICE_LABEL --value "$DEVICE_LABEL"

  _firefox_fullfunctional_build:
    description: Build the FULLFUNCTIONAL_SCHEME scheme and shard the full functional tests across 4 VMs
    before_run:
    - _firefox_fullfunctional_params
    - 1_git_clone_and_post_clone
    - 2_certificate_and_profile
    - 3_provisioning_and_npm_installation
    - skip_macro_validation
    steps:
    - restore-spm-cache@3:
        is_always_run: true
    - activate-build-cache-for-xcode@0: {}
    - xcode-build-for-test@3:
        title: Build Firefox iOS
        inputs:
        - scheme: $FULLFUNCTIONAL_SCHEME
        - configuration: Debug
        - project_path: /Users/vagrant/git/firefox-ios/Client.xcodeproj
        - test_plan: FullFunctionalTestPlan
        - xcodebuild_options: ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO
        - destination: $FULLFUNCTIONAL_DESTINATION
    - xcode-test-shard-calculation@0:
        inputs:
        - product_path: $BITRISE_XCTESTRUN_FILE_PATH
        - shard_count: 4
        - destination: $FULLFUNCTIONAL_DESTINATION
    - deploy-to-bitrise-io@2:
        inputs:
        - pipeline_intermediate_files: |-
            BITRISE_TEST_SHARDS_PATH
            BITRISE_TEST_BUNDLE_PATH
    - share-pipeline-variable@1:
        inputs:
        - variables: |-
            FULLFUNCTIONAL_SCHEME
            FULLFUNCTIONAL_DESTINATION
            FULLFUNCTIONAL_DEVICE_LABEL

  firefox_fullfunctional_shard:
    description: Run one shard of the Firefox full functional tests
    before_run:
    - _firefox_fullfunctional_params
    - 1_git_clone_and_post_clone
    steps:
    - pull-intermediate-files@1: {}
    - script@1:
        title: Find FullFunctionalTestPlan xctestrun file
        inputs:
        - content: |-
            set -euxo pipefail
            XCTESTRUN=$(find "$BITRISE_TEST_BUNDLE_PATH" -name "${FULLFUNCTIONAL_SCHEME}_FullFunctionalTestPlan_*.xctestrun" | head -n 1)
            envman add --key FULLFUNCTIONAL_XCTESTRUN --value "$XCTESTRUN"
    - xcode-test-without-building@0:
        title: Run full functional tests shard
        inputs:
        - only_testing: $BITRISE_TEST_SHARDS_PATH/$BITRISE_IO_PARALLEL_INDEX
        - destination: $FULLFUNCTIONAL_DESTINATION
        - xctestrun: $FULLFUNCTIONAL_XCTESTRUN
        - xcodebuild_options: -collect-test-diagnostics never
    - script@1:
        title: Count failed tests in this shard
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            if [ -z "$BITRISE_XCRESULT_PATH" ]; then
                FAILED_COUNT="no results"
            else
                FAILED_COUNT=$(xcrun xcresulttool get --path "$BITRISE_XCRESULT_PATH" --format json --legacy 2>/dev/null | jq -r '.metrics.testsFailedCount._value // 0')
            fi
            echo "Shard $BITRISE_IO_PARALLEL_INDEX failures: ${FAILED_COUNT:-no results}"
            echo "${FAILED_COUNT:-no results}" > "$BITRISE_DEPLOY_DIR/fullfunctional_result.txt"
    - deploy-to-bitrise-io@2:
        is_always_run: true
        inputs:
        - pipeline_intermediate_files: $BITRISE_DEPLOY_DIR/fullfunctional_result.txt:FULLFUNCTIONAL_RESULT_$BITRISE_IO_PARALLEL_INDEX

  firefox_fullfunctional_report:
    description: Collect the failed test counts from all shards and report them to Slack
    envs:
    - FULLFUNCTIONAL_SHARD_COUNT: 4
    before_run:
    - _firefox_fullfunctional_params
    steps:
    - pull-intermediate-files@1: {}
    - script@1:
        title: Sum failed tests across shards
        inputs:
        - content: |-
            #!/usr/bin/env bash
            TOTAL=0
            DETAILS=""
            STATUS=":white_check_mark:"
            COLOR="#3bc3a3"
            for i in $(seq 0 $((FULLFUNCTIONAL_SHARD_COUNT - 1))); do
                RESULT_FILE_VAR="FULLFUNCTIONAL_RESULT_$i"
                RESULT_FILE="${!RESULT_FILE_VAR}"
                if [ -n "$RESULT_FILE" ] && [ -f "$RESULT_FILE" ]; then
                    COUNT=$(cat "$RESULT_FILE")
                else
                    COUNT="no results"
                fi
                if [[ "$COUNT" =~ ^[0-9]+$ ]]; then
                    TOTAL=$((TOTAL + COUNT))
                    [ "$COUNT" -gt 0 ] && STATUS=":x:" && COLOR="danger"
                else
                    STATUS=":x:"
                    COLOR="danger"
                fi
                DETAILS="${DETAILS}Shard $((i + 1)): ${COUNT}"$'\n'
            done
            echo "Total failures: $TOTAL"
            printf "%b" "$DETAILS"
            envman add --key FULLFUNCTIONAL_SLACK_STATUS --value "$STATUS"
            envman add --key FULLFUNCTIONAL_SLACK_COLOR --value "$COLOR"
            envman add --key FULLFUNCTIONAL_SLACK_MESSAGE --value "Number of failed tests: $TOTAL"
    - slack@4:
        is_always_run: true
        inputs:
        - title: ''
        - author_name: ''
        - webhook_url: "$WEBHOOK_SLACK_TOKEN"
        - footer_icon: https://emoji.slack-edge.com/T07DB2PSS3W/testops-notify/55edcdb3371320b6.png
        - footer: Created by Mobile Test Engineering
        - pretext: "*Firefox-iOS* :firefox: *Full Functional Tests ${FULLFUNCTIONAL_SCHEME} - ${FULLFUNCTIONAL_DEVICE_LABEL}* ${FULLFUNCTIONAL_SLACK_STATUS}"
        - color: "$FULLFUNCTIONAL_SLACK_COLOR"
        - message: "$FULLFUNCTIONAL_SLACK_MESSAGE"
        - timestamp: 'no'
        - fields: |
            Branch | ${BITRISE_GIT_BRANCH}
            Scheme | ${FULLFUNCTIONAL_SCHEME}
            Device | ${FULLFUNCTIONAL_DEVICE_LABEL}
        - buttons: |
            Test Results|https://app.bitrise.io/app/${BITRISE_APP_SLUG}/pipelines/${BITRISEIO_PIPELINE_ID}?tab=tests
