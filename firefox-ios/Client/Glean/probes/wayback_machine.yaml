wayback_error_page:
  check_button_tapped:
    type: event
    description: |
      Records when the user taps the check for archive button.
    bugs:
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16191
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16206
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16209
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16433
    data_reviews:
      - https://github.com/mozilla-mobile/firefox-ios/pull/35045
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: "2026-12-01"
  archive_found:
    type: event
    description: |
      Records when the wayback machine returns a valid archive for the failing URL.
    bugs:
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16191
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16206
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16209
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16433
    data_reviews:
      - https://github.com/mozilla-mobile/firefox-ios/pull/35045
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: "2026-12-01"
  search_the_web_tapped:
    type: event
    description: |
      Records when the user hits search the web due to wayback not finding an archive.
    bugs:
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16191
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16206
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16209
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16433
    data_reviews:
      - https://github.com/mozilla-mobile/firefox-ios/pull/35045
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: "2026-12-01"
