# PyPI package.

# This file is organized (roughly) alphabetically by metric names
# for easy navigation

---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0

$tags:
  - VPN

###############################################################################
# Documentation
###############################################################################

# Add your new metrics and/or events here.
vpn.start:
  failed:
    type: event
    description: |
      Recorded when the VPN fails to start, either because the user turned it
      on or because the app reconnected it at launch.
      Changing location while the VPN is already running is not recorded.
    extra_keys:
      country_code:
        type: string
        description: |
          The location the user selected, as an ISO 3166-1 alpha-2 country
          code, or `REC` when the recommended location is selected.
      failure_reason:
        type: string
        description: |
          Why the VPN failed to start. One of `not_signed_in`,
          `no_server_found`, `proxy_url_cannot_be_generated`,
          `token_provider_unavailable`, `network`, `server_error`, `auth`,
          `attestation` or `unknown` (see `VPNStartFailureReason`).
      trigger:
        type: string
        description: |
          What started the VPN. One of `user`, when the user turns it on, or
          `reconnect_at_launch`, when the app turns it back on at launch
          because it was on before (see `VPNStartTrigger`).
    bugs:
      - https://mozilla-hub.atlassian.net/browse/VPN-7852
    data_reviews:
      - TODO
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: never
  succeeded:
    type: event
    description: |
      Recorded when the VPN starts and the proxy is applied, either because
      the user turned it on or because the app reconnected it at launch.
      Changing location while the VPN is already running is not recorded.
    extra_keys:
      country_code:
        type: string
        description: |
          The location the user selected, as an ISO 3166-1 alpha-2 country
          code, or `REC` when the recommended location is selected. A
          different location may be used if the selected one has no server.
      trigger:
        type: string
        description: |
          What started the VPN. One of `user`, when the user turns it on, or
          `reconnect_at_launch`, when the app turns it back on at launch
          because it was on before (see `VPNStartTrigger`).
    bugs:
      - https://mozilla-hub.atlassian.net/browse/VPN-7852
    data_reviews:
      - TODO
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: never
