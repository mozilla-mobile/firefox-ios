$tags:
  - VPN

###############################################################################
# Documentation
###############################################################################

# Add your new metrics and/or events here.
vpn.stop:
  completed:
    type: event
    description: |
      Recorded when the VPN was running and gets turned off, either by the
      user or through one of the choices in a VPN alert. Not recorded when the
      VPN was not running, or when the app is terminated with the VPN on.
    extra_keys:
      trigger:
        type: string
        description: |
          What turned the VPN off. One of `user`, when the user turns it off,
          or the alert choice the user picked: `continue_without_vpn`,
          `close_this_tab` or `close_all_tabs` (see `VPNStopTrigger`).
    bugs:
      - https://mozilla-hub.atlassian.net/browse/VPN-7852
    data_reviews:
      - TODO
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: never
