# This file defines the metrics that are recorded by the Glean SDK. They are
# automatically converted to Swift code at build time using the `glean_parser`
# PyPI package.

# This file is organized (roughly) alphabetically by metric names
# for easy navigation

---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0

$tags:
  - VPN

###############################################################################
# Documentation
###############################################################################

# Add your new metrics and/or events here.
vpn:
  connection_started:
    type: event
    description: |
      Recorded when the VPN tries to connect after the user turns it on. If
      `error` is set, the connection failed. Changing location while the VPN is already connected
      is not recorded.
    extra_keys:
      country_code:
        type: string
        description: |
          The location the user selected, as an ISO 3166-1 alpha-2 country
          code, or `REC` when the recommended location is selected.
      error:
        type: string
        description: |
          Set only when the connection failed, to why it failed. One of
          `not_signed_in`, `no_server_found`, `proxy_url_cannot_be_generated`,
          `token_provider_unavailable`, `network`, `server_error`,
          `quota_exceeded`, `auth`, `attestation_unsupported`, `attestation`,
          `keychain`, `invalid_response`, `invalid_url` or `unknown`
          (see `VPNConnectionFailureReason`).
      is_using_fallback:
        type: boolean
        description: |
          Set only when the connection succeeded. True when the selected
          location had no usable server, so a different location is used.
      source:
        type: string
        description: |
          What started the connection. Currently always `settings`, when the
          user turns the VPN on in settings (see `VPNConnectionStartSource`).
    bugs:
      - https://mozilla-hub.atlassian.net/browse/VPN-7852
    data_reviews:
      - https://github.com/mozilla-mobile/firefox-ios/pull/36630
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: never
  connection_stopped:
    type: event
    description: |
      Recorded when the VPN is turned off, either by the user or through one
      of the choices in a VPN alert. Not recorded when the app is terminated
      with the VPN on.
    extra_keys:
      source:
        type: string
        description: |
          What turned the VPN off. One of `settings`, when the user turns it
          off in settings, or the alert choice the user picked:
          `continue_without_vpn`, `close_this_tab` or `close_all_tabs`
          (see `VPNConnectionStopSource`).
    bugs:
      - https://mozilla-hub.atlassian.net/browse/VPN-7852
    data_reviews:
      - https://github.com/mozilla-mobile/firefox-ios/pull/36630
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: never
  onboarding_shown:
    type: event
    description: |
      Recorded when the VPN onboarding sheet is presented.
    bugs:
      - https://mozilla-hub.atlassian.net/browse/FXIOS-17440
    data_reviews:
      - https://github.com/mozilla-mobile/firefox-ios/pull/36773
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: never
  onboarding_cancelled:
    type: event
    description: |
      Recorded when the user dismisses the VPN onboarding sheet with the close
      button or by swiping it down.
    bugs:
      - https://mozilla-hub.atlassian.net/browse/FXIOS-17440
    data_reviews:
      - https://github.com/mozilla-mobile/firefox-ios/pull/36773
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: never
  onboarding_cta_tapped:
    type: event
    description: |
      Recorded when the user taps "Turn On VPN" on the VPN onboarding sheet.
    bugs:
      - https://mozilla-hub.atlassian.net/browse/FXIOS-17440
    data_reviews:
      - https://github.com/mozilla-mobile/firefox-ios/pull/36773
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: never
  onboarding_learn_more_link_tapped:
    type: event
    description: |
      Recorded when the user taps the "Learn more" link on the VPN onboarding
      sheet.
    bugs:
      - https://mozilla-hub.atlassian.net/browse/FXIOS-17440
    data_reviews:
      - https://github.com/mozilla-mobile/firefox-ios/pull/36773
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: never

vpn.session_error_alert:
  option_selected:
    type: event
    description: |
      Recorded when the user picks an option on a VPN alert shown mid-session,
      either because the monthly data limit was reached or because of a
      session error.
    extra_keys:
      error_type:
        type: string
        description: |
          Why the alert was shown. One of `monthly_limit` or `session_error`
          (see `VPNAlertType`).
      option:
        type: string
        description: |
          The option the user picked. One of `continue_without_vpn`,
          `close_this_tab` or `close_all_tabs` (see `VPNAlertOption`).
    bugs:
      - https://mozilla-hub.atlassian.net/browse/VPN-7852
    data_reviews:
      - https://github.com/mozilla-mobile/firefox-ios/pull/36694
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: never
