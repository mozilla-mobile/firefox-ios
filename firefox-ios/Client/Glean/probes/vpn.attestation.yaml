# for easy navigation

---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0

$tags:
  - VPN

###############################################################################
# Documentation
###############################################################################

# Add your new metrics and/or events here.
vpn.attestation:
  failed:
    type: event
    description: |
      Recorded when App Attest enrollment for the VPN fails, either on the
      device or because the backend rejected the attestation.
    extra_keys:
      failure_reason:
        type: string
        description: |
          Why the attestation failed. One of `unsupported`, `key_unusable`,
          `network`, `session_not_persisted`, `not_available` or `unknown`
          (see `VPNAttestationFailureReason`).
    bugs:
      - https://mozilla-hub.atlassian.net/browse/VPN-7819
    data_reviews:
      - TODO
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: never
  succeeded:
    type: event
    description: |
      Recorded when App Attest enrollment for the VPN succeeds and the backend
      issues a device session. Refreshing an existing session is not recorded.
    bugs:
      - https://mozilla-hub.atlassian.net/browse/VPN-7819
    data_reviews:
      - TODO
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: never
