---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0

$tags:
  - WaybackMachine
  - ErrorPage

###############################################################################
# Documentation
###############################################################################

# Add your new metrics and/or events here.

webview.error_page.wayback_machine:
  check_archive_button_tapped:
    type: event
    description: |
      Recorded when the user taps the button to check for a Wayback Machine archive of a webpage.
    bugs:
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16434
    data_reviews:
      - https://github.com/mozilla-mobile/firefox-ios/pull/35045
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: "2026-12-01"
  archive_found:
    type: event
    description: |
      Recorded when the Wayback Machine returns a valid archive for a failing URL.
    bugs:
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16434
    data_reviews:
      - https://github.com/mozilla-mobile/firefox-ios/pull/35045
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: "2026-12-01"
  search_the_web_button_tapped:
    type: event
    description: |
      Recorded when the user taps the button to search the web after the Wayback Machine finds no archive for a webpage.
    bugs:
      - https://mozilla-hub.atlassian.net/browse/FXIOS-16434
    data_reviews:
      - https://github.com/mozilla-mobile/firefox-ios/pull/35045
    notification_emails:
      - fx-ios-data-stewards@mozilla.com
    expires: "2026-12-01"
