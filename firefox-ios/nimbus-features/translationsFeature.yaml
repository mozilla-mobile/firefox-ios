# The configuration for the translationsFeature feature
features:
  translations-feature:
    no-lint: [MISSING_CONTACTS]
    description: >
      Enables translations feature.
    variables:
      enabled:
        description: >
          Whether or not to enable translations feature.
        type: Boolean
        default: true
      languagePickerEnabled:
        description: >
          Whether or not to enable the translations language picker (Phase 2).
        type: Boolean
        default: true
