# The configuration for the Nova design feature
features:
  nova-design-feature:
    description: >
      The feature flag to manage the rollout of Nova design.
    variables:
      enabled:
        description: >
          Enables Nova design.
        type: Boolean
        default: false
      privateThemeOverride:
        description: >
          If true, screens that opt in follow the regular light/dark Nova theme while the user is
          browsing in private mode, instead of the purple private theme.
        type: Boolean
        default: false
    defaults:
      - channel: beta
        value:
          enabled: false
          privateThemeOverride: false
      - channel: developer
        value:
          enabled: false
          privateThemeOverride: false
