# The configuration for the cellularDataRestrictedErrorPageFeature feature
features:
  cellular-data-restricted-error-page-feature:
    description: >
      Controls restricted cellular data guidance on error pages
    variables:
      enabled:
        description: >
          Whether or not this feature is enabled
        type: Boolean
        default: false
    defaults:
      - channel: beta
        value:
          enabled: false
      - channel: developer
        value:
          enabled: true
