# The configuration for the quickAnswersFeature feature
features:
  quick-answers-feature:
    description: >
      The feature flag to manage the roll out of the quick answers feature.
    variables:
      enabled:
        description: >
          Enables the feature.
        type: Boolean
        default: false
      model:
        description: >
          Which provider model backs Quick Answers.
        type: QuickAnswersModel
        default: exa
      optInRedesign:
        description: >
          Shows the redesigned opt-in as a sheet over the browser.
        type: Boolean
        default: false
    defaults:
      - channel: beta
        value:
          enabled: false
          model: exa
          optInRedesign: false
      - channel: developer
        value:
          enabled: true
          model: exa
          optInRedesign: true

enums:
  QuickAnswersModel:
    description: The provider model that backs the Quick Answers feature.
    variants:
      exa:
        description: The Exa model provider.
      liner:
        description: The Liner model provider.
