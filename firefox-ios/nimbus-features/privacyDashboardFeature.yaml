# The configuration for the privacyDashboardFeature feature
features:
  privacy-dashboard-feature:
    description: >
      The Privacy Dashboard feature from homepage
    variables:
      enabled:
        description: >
          Whether or not this feature is enabled
        type: Boolean
        default: false
    defaults:
      - channel: beta
        value:
          enabled: false
      - channel: developer
        value:
          enabled: true