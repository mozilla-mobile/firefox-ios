# The configuration for the installationTelemetryFeature feature
features:
  installation-telemetry-feature:
    description: >
      Controls installation telemetry for measuring app redownloads.
    variables:
      enabled:
        description: >
          Whether installation telemetry is enabled.
        type: Boolean
        default: false
    defaults:
      - channel: beta
        value:
          enabled: false
      - channel: developer
        value:
          enabled: false
