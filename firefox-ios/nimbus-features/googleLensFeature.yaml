# The configuration for the Google Lens feature
features:
  google-lens-feature:
    description: >
      The feature flag to manage the rollout of Google Lens.
    variables:
      enabled:
        description: >
          Enables Google Lens entry points.
        type: Boolean
        default: true
      search-interstitial-enabled:
        description: >
          Enables the Google Lens search interstitial.
        type: Boolean
        default: false
    defaults:
      - channel: beta
        value:
          enabled: true
          search-interstitial-enabled: false
      - channel: developer
        value:
          enabled: true
          search-interstitial-enabled: true
