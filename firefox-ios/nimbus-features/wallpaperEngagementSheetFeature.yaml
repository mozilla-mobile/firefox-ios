# The configuration for the wallpaperEngagementSheetFeature feature
features:
  wallpaper-engagement-sheet-feature:
    description: >
      Controls the wallpaper engagement bottom sheet shown on the homepage
      when new wallpapers are available. Only meant to be used with rollouts.
    variables:
      enabled:
        description: >
          Whether or not this feature is enabled
        type: Boolean
        default: false
      marketing-slug:
        description: >
          Identifies the wallpaper campaign. The sheet is shown once per slug,
          so a new value is needed for every wallpaper drop.
        type: String
        default: ""
      backdrop-color:
        description: >
          Hex color (e.g. "8E5CD9") of the gradient shown behind the sheet image.
        type: String
        default: "8E5CD9"
      image:
        description: >
          Base64 encoded image shown at the top of the sheet. When empty or
          invalid, a default image is shown.
        type: String
        default: ""
