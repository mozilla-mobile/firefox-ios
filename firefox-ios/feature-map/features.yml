# Code that serves many features. Attribute here rather than forcing it into one feature.
shared:
  - id: SHARED.SHELL
    name: "Browser shell: app/scene lifecycle, browser view controller, coordinators, routing"
  - id: SHARED.ARCH
    name: "Architecture and utilities: Redux, dependency injection, extensions, helpers"
  - id: SHARED.UI
    name: "Shared UI: component library, theming infrastructure, generic views"
  - id: SHARED.DATA
    name: "Shared data layer: profile, storage infrastructure, networking"
  - id: SHARED.WEB
    name: "Web engine integration: web views, user scripts, internal schemes"
  - id: SHARED.TELEMETRY
    name: "Telemetry infrastructure"
  - id: SHARED.EXPERIMENTS
    name: "Nimbus, feature flags and remote configuration infrastructure"

# Code that is not counted toward any feature or shared bucket.
excluded:
  - id: EXCLUDED
    name: "Generated code, strings, third-party code and test support"
