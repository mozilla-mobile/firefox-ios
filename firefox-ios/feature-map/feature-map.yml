# Attributes Firefox iOS source files to features in features.yml.
# The most specific matching rule wins: an exact file path beats a glob, and among
# globs the one with more literal path segments wins. Rule order does not matter.
# `by: ai` marks rules that were generated and not yet reviewed; delete it once a
# person has checked the rule. See README.md.

roots:
  - firefox-ios/Client
  - firefox-ios/Storage
  - firefox-ios/Providers
  - firefox-ios/WidgetKit
  - firefox-ios/CredentialProvider
  - firefox-ios/RustFxA
  - firefox-ios/Extensions
  - firefox-ios/ThirdParty
  - firefox-ios/Shared
  - firefox-ios/Sync
  - firefox-ios/Push
  - firefox-ios/Account
  - BrowserKit/Sources

