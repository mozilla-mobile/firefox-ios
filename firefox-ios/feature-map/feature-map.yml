  - {path: "firefox-ios/Client/Generated/**", feature: EXCLUDED, by: ai}
  - {path: "firefox-ios/Storage/Generated/**", feature: EXCLUDED, by: ai}
  - {path: "firefox-ios/Storage/ThirdParty/**", feature: EXCLUDED, by: ai}
