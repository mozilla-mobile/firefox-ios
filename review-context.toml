version = 1

[[rules]]
name = "Change correctness"
when = { any_file = { include = ["**"] } }
load = [{ type = "file", path = ".claude/review/change-correctness.md" }]

[[rules]]
name = "UI accessibility"
when = { any_file = { ext = [".swift"] } }
load = [{ type = "file", path = ".claude/skills/accessibility/SKILL.md" }]

[[rules]]
name = "Firefox coordinators"
when = { any_file = { include = ["firefox-ios/Client/Coordinators/**"], ext = [".swift"] } }
load = [{ type = "file", path = ".claude/skills/firefox-coordinators/SKILL.md" }]
